[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# Exact compiler pin, frozen before deploy; bump deliberately, never implicitly via a range.
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# CheckpointRegistry's CheckpointInput (20 fields) overflows plain codegen's
# stack when EIP-712-hashed; via-IR is solc's own recommended fix (same
# semantics, better register allocation), not a functional change.
via_ir = true
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
# Deploy.s.sol writes the deployment manifest here; scoped to this one
# directory rather than the whole project.
fs_permissions = [{ access = "read-write", path = "deployments" }]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 64

# lib/forge-std and lib/openzeppelin-contracts are git submodules (see
# README.md); run `make contracts-deps` after a fresh clone to fetch them.
# See more config options:
# https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
