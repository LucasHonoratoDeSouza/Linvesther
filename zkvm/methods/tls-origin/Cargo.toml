[package]
name = "zkvm-methods-tls-origin"
version = "0.1.0"
edition.workspace = true
publish = false

[build-dependencies]
risc0-build = { version = "^3.0.6" }

[dependencies]
risc0-zkvm = { version = "^3.0.6" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
k256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.11"

[package.metadata.risc0]
methods = ["guest"]
