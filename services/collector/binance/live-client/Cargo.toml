[package]
name = "binance-live-client"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
collector-credentials = { path = "../../credentials" }
exchange-core = { path = "../../exchange-core" }
binance-trades = { path = "../trades" }
binance-catalog = { path = "../catalog" }
binance-flows = { path = "../flows" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
