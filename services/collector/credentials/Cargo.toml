[package]
name = "collector-credentials"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.11"
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }
hmac = "0.12"
sha2 = "0.11"
hex = "0.4"
thiserror = "1"
