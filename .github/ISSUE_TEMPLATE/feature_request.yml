name: Feature request
description: Suggest an improvement or a new connection
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and trust impact
      description: What would this expose, and what would it guarantee?
